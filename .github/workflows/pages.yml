# Publica la tienda (Suplemex/frontend) en GitHub Pages cada vez que se sube un cambio a main.
# GitHub Pages solo sirve archivos estáticos: el chatbot usa automáticamente la función
# `chatbot` de Supabase, y los pedidos y cuentas siguen funcionando con Supabase.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Suplemex/frontend
      - id: despliegue
        uses: actions/deploy-pages@v4
